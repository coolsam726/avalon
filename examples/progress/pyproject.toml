[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progress"
version = "0.1.0"
description = "Progress — Avalon application"
requires-python = ">=3.11"
dependencies = [
    "avalon",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "bootstrap", "config", "routes"]
