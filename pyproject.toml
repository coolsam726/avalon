[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avalon"
version = "0.1.0"
description = "Laravel-inspired Python web framework with Adonis-class DX on FastAPI/Starlette"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Avalon Contributors" }]
keywords = ["avalon", "web", "framework", "fastapi", "laravel", "adonis"]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]
caliburn = []

[project.scripts]
avalon = "avalon.installer.cli:app"
grail = "avalon.grail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/avalon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# Coverage is opt-in so `pytest tests/smoke` stays a clean gate.
# Full suite with coverage: `pytest -q --cov=avalon --cov-report=term-missing --cov-report=xml`
# (fail_under=95 comes from [tool.coverage.report])
markers = [
    "smoke: end-to-end smoke gates for the current milestones",
    "regression: locks public contracts against accidental breakage",
]

[tool.coverage.run]
branch = true
source = ["avalon"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
